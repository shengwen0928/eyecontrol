name: Build APK


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 不用 android-actions/setup-android：它會跑 sdkmanager tools，而
      # tools 套件已從軟體庫移除，步驟會直接失敗。改用 runner 預裝的 SDK。
      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDK_BIN="$(echo "$SDK_ROOT"/cmdline-tools/*/bin | cut -d' ' -f1)"
          export PATH="$SDK_BIN:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"


      - name: Build debug APK
        run: |
          rm -f local.properties
          java -jar gradle/wrapper/gradle-wrapper.jar assembleDebug --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eyecontrol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

