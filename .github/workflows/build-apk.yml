name: Build APK


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 不用 android-actions/setup-android：它會跑 sdkmanager tools，而
      # tools 套件已從軟體庫移除，步驟會直接失敗。改用 runner 預裝的 SDK。
      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDK_BIN="$(echo "$SDK_ROOT"/cmdline-tools/*/bin | cut -d' ' -f1)"
          export PATH="$SDK_BIN:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Play 版 release 鑰匙：只在需要 bundlePlayRelease 時解出，絕不印出、不進 repo。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.EYE_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "EYE_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build sideload APK and Play AAB
        env:
          EYE_RELEASE_STORE_PASSWORD: ${{ secrets.EYE_RELEASE_STORE_PASSWORD }}
          EYE_RELEASE_KEY_PASSWORD: ${{ secrets.EYE_RELEASE_KEY_PASSWORD }}
          EYE_RELEASE_KEY_ALIAS: ${{ secrets.EYE_RELEASE_KEY_ALIAS }}
        run: |
          rm -f local.properties
          gradle assembleSideloadDebug bundlePlayRelease --stacktrace

      - name: Dependency report (license audit evidence)
        run: |
          gradle :app:dependencies --configuration sideloadDebugRuntimeClasspath --console=plain > dependency-report-sideloadDebugRuntimeClasspath.txt
          gradle :app:dependencies --configuration sideloadDebugCompileClasspath --console=plain > dependency-report-sideloadDebugCompileClasspath.txt
      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            dependency-report-sideloadDebugRuntimeClasspath.txt
            dependency-report-sideloadDebugCompileClasspath.txt

      - name: Show Play AAB signing certificate
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          keytool -printcert -jarfile "$AAB" || echo "no JAR signature block; AAB uses APK Signature Scheme only"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eyecontrol-sideload-debug-apk
          path: app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: eyecontrol-play-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 30
